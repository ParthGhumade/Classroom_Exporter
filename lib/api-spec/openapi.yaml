openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Google Classroom to Drive Exporter API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Google OAuth operations
  - name: courses
    description: Google Classroom course operations
  - name: exports
    description: Export job operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/status:
    get:
      operationId: getAuthStatus
      tags: [auth]
      summary: Get authentication status
      description: Returns whether the user is authenticated with Google
      responses:
        "200":
          description: Auth status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"

  /auth/url:
    get:
      operationId: getAuthUrl
      tags: [auth]
      summary: Get Google OAuth URL
      description: Returns the URL to redirect the user to for Google OAuth
      responses:
        "200":
          description: OAuth URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUrl"

  /auth/logout:
    delete:
      operationId: logout
      tags: [auth]
      summary: Logout
      description: Clear the stored Google OAuth tokens
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      summary: List Google Classroom courses
      description: Returns all courses the authenticated user is enrolled in or teaches
      responses:
        "200":
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
        "401":
          description: Not authenticated

  /exports:
    get:
      operationId: listExports
      tags: [exports]
      summary: List all export jobs
      description: Returns all past and current export jobs
      responses:
        "200":
          description: List of export jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExportJob"
    post:
      operationId: createExport
      tags: [exports]
      summary: Start an export job
      description: Start exporting all Drive files from a Google Classroom course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportInput"
      responses:
        "201":
          description: Export job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJob"
        "401":
          description: Not authenticated

  /exports/{id}:
    get:
      operationId: getExport
      tags: [exports]
      summary: Get export job status
      description: Returns the current status and log entries of an export job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Export job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJobDetail"
        "404":
          description: Export not found

  /exports/{id}/logs:
    get:
      operationId: getExportLogs
      tags: [exports]
      summary: Get export logs
      description: Returns all log entries for an export job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Export log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExportLogEntry"
        "404":
          description: Export not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthStatus:
      type: object
      properties:
        authenticated:
          type: boolean
        email:
          type: ["string", "null"]
        name:
          type: ["string", "null"]
      required:
        - authenticated
        - email
        - name

    AuthUrl:
      type: object
      properties:
        url:
          type: string
      required:
        - url

    Course:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        section:
          type: ["string", "null"]
        descriptionHeading:
          type: ["string", "null"]
        courseState:
          type: string
        enrollmentCode:
          type: ["string", "null"]
        teacherFolder:
          type: ["string", "null"]
        creationTime:
          type: ["string", "null"]
        updateTime:
          type: ["string", "null"]
      required:
        - id
        - name
        - courseState

    ExportInput:
      type: object
      properties:
        courseId:
          type: string
        courseName:
          type: string
        targetFolderId:
          type: string
      required:
        - courseId
        - courseName
        - targetFolderId

    ExportJob:
      type: object
      properties:
        id:
          type: integer
        courseId:
          type: string
        courseName:
          type: string
        targetFolderId:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed]
        totalFiles:
          type: ["integer", "null"]
        copiedFiles:
          type: ["integer", "null"]
        skippedFiles:
          type: ["integer", "null"]
        failedFiles:
          type: ["integer", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - courseId
        - courseName
        - targetFolderId
        - status
        - createdAt
        - updatedAt

    ExportJobDetail:
      type: object
      properties:
        id:
          type: integer
        courseId:
          type: string
        courseName:
          type: string
        targetFolderId:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed]
        totalFiles:
          type: ["integer", "null"]
        copiedFiles:
          type: ["integer", "null"]
        skippedFiles:
          type: ["integer", "null"]
        failedFiles:
          type: ["integer", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
        logs:
          type: array
          items:
            $ref: "#/components/schemas/ExportLogEntry"
      required:
        - id
        - courseId
        - courseName
        - targetFolderId
        - status
        - createdAt
        - updatedAt
        - logs

    ExportLogEntry:
      type: object
      properties:
        id:
          type: integer
        exportId:
          type: integer
        level:
          type: string
          enum: [info, success, warning, error]
        message:
          type: string
        fileId:
          type: ["string", "null"]
        fileName:
          type: ["string", "null"]
        sourceName:
          type: ["string", "null"]
        copiedFileId:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - exportId
        - level
        - message
        - createdAt
